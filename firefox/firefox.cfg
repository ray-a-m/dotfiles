// IMPORTANT: Firefox skips the first line of firefox.cfg by historical
// convention. Do not put runnable code on this line.
//
// Binds Ctrl+; (Semicolon) to toggle the [chrome-hidden] attribute on
// the chrome document's root element. userChrome.css reads that
// attribute to slide #navigator-toolbox in/out — so this is the actual
// sticky state behind the visible toggle. Default (no attribute) is
// chrome-shown; setting the attribute hides the top toolbox.
//
// Hotkey history (avoid these traps if rebinding):
//   - Ctrl+Shift+M is taken by Firefox (Responsive Design Mode)
//   - Ctrl+Alt+M is taken by fcitx5 (word-completion toggle)
//   - Ctrl+; / Ctrl+\ have no known conflicts and sit close to home row
//
// Stable assumptions baked in:
//   - The autoconfig sandbox is OFF (set in autoconfig.js); otherwise
//     Components.utils.import / Services would be unavailable.
//   - "domwindowopened" fires for every chrome window opened in this
//     process; we filter to navigator:browser windows so private-
//     browsing, devtools, and dialog windows aren't bound twice.
//   - Window-level keydown with capture=true catches the chord before
//     any content frame can swallow it. Modifier combos route through
//     chrome's master keymap regardless of whether focus is in chrome
//     or content, so this listener fires either way.
//   - The toggle attribute lives on the chrome document root (not the
//     content document), so it survives page navigation.
//
// Hotkey is hard-coded here. Change the keydown predicate to repoint.

try {
  // Modern Firefox exposes `Services` as a global in chrome JS contexts;
  // the legacy Components.utils.import / Services.jsm and the newer
  // ChromeUtils.importESModule("Services.sys.mjs") paths both fail in
  // recent versions (2026-05). The chrome window object delivered by
  // the observer is already the Window — no QueryInterface needed.
  Services.obs.addObserver({
    observe(win) {
      win.addEventListener("load", function onLoad() {
        win.removeEventListener("load", onLoad, true);
        const doc = win.document;
        const wt = doc.documentElement.getAttribute("windowtype") || "";
        if (!wt.startsWith("navigator:browser")) return;
        win.addEventListener("keydown", (e) => {
          // Ctrl+; (Semicolon). Avoids Firefox's Ctrl+Shift+M (RDM),
          // fcitx5's Ctrl+Alt+M (completion toggle), and most web-app
          // single-modifier chords. e.code is layout-independent.
          if (
            e.code === "Semicolon" &&
            e.ctrlKey &&
            !e.altKey && !e.shiftKey && !e.metaKey
          ) {
            const root = doc.documentElement;
            if (root.hasAttribute("chrome-hidden")) {
              root.removeAttribute("chrome-hidden");
            } else {
              root.setAttribute("chrome-hidden", "true");
            }
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      }, true);
    }
  }, "domwindowopened", false);
} catch (e) {
  Components.utils.reportError("[chrome-toggle] init failed: " + e);
}
