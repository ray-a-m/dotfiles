# Prefix. Primary is M-Space, emitted by the Corne's layer-2 right-center
# thumb (MO(2) + right-center = Alt+Space). C-Space is kept as prefix2 for
# the laptop keyboard where the Corne isn't attached.
set -g prefix M-Space
set -g prefix2 C-Space
bind M-Space send-prefix

# Reload config
bind q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls. Mnemonic: j = "down" (vim), l = "right" (vim), w = "wipe",
# f = "focus" (zoom to fullscreen).
bind j split-window -v -c "#{pane_current_path}"
bind l split-window -h -c "#{pane_current_path}"
bind w kill-pane
bind f resize-pane -Z

bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D

bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Resize pane, vim-directional, repeatable. `-r` lets you chain within
# repeat-time (500ms) without re-pressing prefix: <pfx> J J J J slides down
# by 20 cells total.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Swap pane in a direction — the tmux analog of Hyprland's Super+Shift+hjkl
# (move window). Root-level chord (no prefix) to mirror the WM feel; needs
# `extended-keys on` (set below) so kitty's csi-u encoding lets tmux tell
# C-S-h apart from vim-tmux-navigator's plain C-h. `{left-of}` &c. are tmux's
# directional pane targets, so this swaps with the neighbour you point at.
bind -n C-S-h swap-pane -s '{left-of}'
bind -n C-S-j swap-pane -s '{down-of}'
bind -n C-S-k swap-pane -s '{up-of}'
bind -n C-S-l swap-pane -s '{right-of}'

# Move a pane to another window. <pfx> ! enters a one-shot key-table that
# consumes the next key: a digit joins this pane into that window, a second
# ! breaks it into a fresh window. Trade-off: bare <pfx> ! no longer breaks
# immediately (it waits for the next key), so breaking is the double-tap ! !.
# join-pane -t :N needs window N to exist; break-pane is what makes a new one.
bind ! switch-client -T panemove
bind -T panemove 1 join-pane -t :1
bind -T panemove 2 join-pane -t :2
bind -T panemove 3 join-pane -t :3
bind -T panemove 4 join-pane -t :4
bind -T panemove 5 join-pane -t :5
bind -T panemove 6 join-pane -t :6
bind -T panemove 7 join-pane -t :7
bind -T panemove 8 join-pane -t :8
bind -T panemove 9 join-pane -t :9
bind -T panemove ! break-pane

# Window navigation
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
# kill-window has no shortcut. Type `<pfx> :kill-w<Tab>` when you need it —
# the friction is deliberate. Same reason kill-session sits behind a confirm.

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1
# Go to the window left / right on Alt+h / Alt+l (vim mnemonic: h = left,
# l = right), aliasing the M-Left/M-Right nav above. Root-level, so these claim
# Alt+h and Alt+l globally inside tmux — fine as long as no TUI you run inside
# tmux wants them (your native Emacs M-hjkl motions are unaffected — that's a
# GUI app, not a tmux client).
bind -n M-h select-window -t -1
bind -n M-l select-window -t +1

# Prev/next window via <pfx> { / <pfx> }. Overrides tmux's default swap-pane
# bindings on those keys (which reorder panes within a window — rarely used).
# `{` and `}` are tmux's block delimiters; quote them here so the parser
# treats them as key names.
bind -r '{' previous-window
bind -r '}' next-window

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
# kill-session has no shortcut either — most destructive tmux action;
# type `<pfx> :kill-s<Tab>` when you actually want it.
bind P switch-client -p
bind N switch-client -n

bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
# tmux only enables extended-key reporting for terminals it believes support
# it, gated on the `extkeys` terminal-feature. kitty's terminfo (xterm-kitty)
# matches the built-in `xterm*` features block, which lacks extkeys — so
# without this line tmux never requests csi-u from kitty and root-level
# modified chords (e.g. C-S-hjkl pane-swap) never arrive. Same gap the
# manual shift+enter map in kitty.conf works around.
set -as terminal-features 'xterm-kitty:extkeys'
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 60
set -g window-status-separator ""
# Window naming is delegated to the tmux-window-name plugin (loaded below),
# which recognizes running programs (nvim, ssh host, git repo). Enabling tmux's
# built-in automatic-rename here would race with the plugin.

# Theme — chevron-ribbon powerline. Catppuccin Latte palette is the
# committed baseline for all future themes (2026-07-05 decision:
# theme swaps become wallpaper-only changes; colors.toml stays put).
# Non-current tabs + hostname pill: `#e6e9ef` (Catppuccin mantle),
# one shade darker than terminal bg `#fafcff`. Current tab: pure
# `#ffffff`, one shade brighter. Text is `#4c4f69` (Catppuccin fg).
# Subtle glass-adjacent differentiation instead of opaque powerline
# navy. Nerd Font glyphs: U+E0B0 () = right cap, U+E0B2 () = left cap.
set -g status-style "bg=default,fg=default"

# Left: hostname pill (dynamic across machines). #S session-name
# display retired 2026-07-05 per Raymond; a session-role indicator
# can slot in here later if a multi-session workflow lands.
set -g status-left "#[bg=#e6e9ef,fg=#4c4f69,bold] #h "

# Window tabs — chevron-shaped, touching (no spacer). Non-current
# tabs one shade darker than terminal bg; current tab one shade
# brighter. Chevron caps in the tab's own bg color.
setw -g window-status-format         "#[fg=#e6e9ef,bg=#e6e9ef]#[bg=#e6e9ef,fg=#4c4f69] #I  #W #[fg=#e6e9ef]#{?window_end_flag,#[bg=default],#[bg=#e6e9ef]}"
setw -g window-status-current-format "#[fg=#e6e9ef,bg=#ffffff]#[bg=#ffffff,fg=#4c4f69,bold] #I  #W #[fg=#ffffff]#{?window_end_flag,#[bg=default],#[bg=#e6e9ef]}"

# Right: mode indicators. Only rendered when their condition is
# true; nothing shown when idle. PREFIX red + COPY yellow keep pop
# for attention; ZOOM uses Catppuccin Latte's lavender `#7287fd` —
# distinct from the two "warning" colors, still reads as a state
# marker. `#[...]` directives sit OUTSIDE each `#{?...}` ternary
# because `\,` escape inside `#[fg=X\,bg=Y]` inside a branch fails
# to parse (empirically verified 2026-07-05). Each ternary emits
# only the chevron cap glyph + text conditionally; the color is
# always set (harmless when the branch is empty).
set -g status-right "#[fg=red,bg=default]#{?client_prefix,#[bg=red,fg=black,bold] PREFIX ,}#[fg=yellow,bg=default]#{?pane_in_mode,#[bg=yellow,fg=black,bold] COPY ,}#[fg=#7287fd,bg=default]#{?window_zoomed_flag,#[bg=#7287fd,fg=white,bold] ZOOM ,}"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue


# One blank status row underneath the tab row so the pane content has
# vertical breathing room from the bar. `status 2` makes the bar two
# lines tall; status-format[1] is the second (blank) line. Both lines
# remain at the top of the screen because status-position is top.
set -g status 2
set -g status-format[1] ""

# Plugins (tpm). List `@plugin` entries above the `run` line. After adding a
# plugin, reload the config (bind q) then press <pfx> I to install it.
# tpm itself is cloned by install.sh into ~/.tmux/plugins/tpm.
#
# Pin the install path to the non-XDG default. Without this, tpm auto-detects
# $XDG_CONFIG_HOME/tmux/ and installs plugins next to the config — which, since
# our config is symlinked into dotfiles, would commit per-machine plugin state
# to git. Keep plugins per-machine at ~/.tmux/plugins/.
setenv -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'

# Session persistence. resurrect saves/restores state on demand (<pfx> C-s /
# <pfx> C-r); continuum wraps it with auto-save every 15min + auto-restore
# on tmux server start.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Auto-save every 15min protects against crashes; auto-restore is OFF so a
# fresh boot always starts clean instead of resurrecting stale session state
# on top of the `Work` session that Super+Return creates. Restore explicitly
# with <pfx> C-r when you want the last-saved state back.
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# Better clipboard yank in copy mode. Adds `Y` = yank whole line, and syncs
# selection to system clipboard even without `set-clipboard on`.
set -g @plugin 'tmux-plugins/tmux-yank'

# Unified pane/split nav between tmux and nvim. Ctrl-h/j/k/l crosses the
# boundary. NOTE: also requires the nvim-side plugin
# `christoomey/vim-tmux-navigator` in your nvim config to complete the loop.
set -g @plugin 'christoomey/vim-tmux-navigator'

# Auto window naming based on the running program (nvim, ssh host, git repo)
# rather than just cwd basename. Replaces tmux's built-in `automatic-rename`
# (removed from the status-bar section above — the two would race).
set -g @plugin 'ofirgall/tmux-window-name'

# tmux-powerline was tested 2026-07-04 and dropped: it silently overrides
# status-right on load, which killed the minimal `PREFIX / COPY / ZOOM`
# indicator we care about. Restore by re-adding the @plugin line and
# manually running <pfx> I; but you'll need to reclaim status-right after
# tpm's `run` line at the bottom of this file.

run '~/.tmux/plugins/tpm/tpm'

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
