# Change the default Omarchy look'n'feel

# https://wiki.hypr.land/Configuring/Basics/Variables/#general
general {
    # waybar pills sit at y=6..38 with "exclusive": false, so top gap
    # must clear that. Commas required — space-separated 4-tuple is
    # silently read as all-sides = first value.
    gaps_out = 48, 10, 10, 10

    # Border thickness — Hyprland doesn't expose per-focus sizes, so this is
    # global. 1px is just enough to draw the black hairline around inactive
    # windows; the focused border at alpha 0 leaves that 1px as transparent
    # wallpaper-showthrough, which reads as no border at normal viewing
    # distance.
    border_size = 1

    # Active: fully transparent — the focused window appears unbordered.
    # Inactive: thin black line, clearly distinguishing unfocused windows.
    col.active_border = rgba(00000000)
    col.inactive_border = rgba(000000ff)

    # layout = scrolling
}

# Mirror onto window groups (tabbed/stacked) so a grouped window's bar uses
# the same palette instead of falling back to omarchy defaults.
group {
    col.border_active = rgba(00000000)
    col.border_inactive = rgba(000000ff)
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#decoration
decoration {
    rounding = 12

    blur {
        size = 4
        passes = 3
        # Omarchy default brightness=0.60/contrast=0.75 dims the blur
        # for dark themes; force neutral so light themes keep their
        # wallpaper vibrancy.
        brightness = 1.0
        contrast = 1.0
        # Required for blur to apply through translucent windows, not
        # just fully-transparent layer shells.
        ignore_opacity = true
        new_optimizations = true
    }

    # dim_inactive = true
    # dim_strength = 0.15
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#animations
animations {
    # Disable all animations
    # enabled = no
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}
