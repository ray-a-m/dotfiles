# Application bindings
bindd = SUPER, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" ~/.config/hypr/scripts/tmux-launch.sh
bindd = SUPER ALT, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music (toggle special:music; auto-launch if empty), exec, ~/.config/hypr/scripts/music.sh
bindd = SUPER SHIFT, N, Scribbles (toggle special:notes; auto-yazi if empty), exec, ~/.config/hypr/scripts/scribbles.sh
bindd = SUPER, E, File manager (yazi), exec, uwsm-app -- kitty --class yazi -e yazi
bindd = SUPER SHIFT, O, Notes, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"

# vim-style window navigation (replaces SUPER+arrow defaults).
# Unbinds first because both the arrow defaults and SUPER+L (toggle layout)
# are set by Omarchy's tiling defaults.
unbind = SUPER, LEFT
unbind = SUPER, RIGHT
unbind = SUPER, UP
unbind = SUPER, DOWN
unbind = SUPER SHIFT, LEFT
unbind = SUPER SHIFT, RIGHT
unbind = SUPER SHIFT, UP
unbind = SUPER SHIFT, DOWN
unbind = SUPER, L
unbind = SUPER, J
unbind = SUPER, K

bindd = SUPER, H, Focus left,  movefocus, l
bindd = SUPER, J, Focus down,  movefocus, d
bindd = SUPER, K, Focus up,    movefocus, u
bindd = SUPER, L, Focus right, movefocus, r

bindd = SUPER SHIFT, H, Swap window left,  swapwindow, l
bindd = SUPER SHIFT, J, Swap window down,  swapwindow, d
bindd = SUPER SHIFT, K, Swap window up,    swapwindow, u
bindd = SUPER SHIFT, L, Swap window right, swapwindow, r

# SUPER+T toggles float/tile (omarchy default); SHIFT+T flips split direction.
bindd = SUPER SHIFT, T, Toggle split direction, layoutmsg, togglesplit

# Omarchy menu on SUPER+E (replaces SUPER+ALT+SPACE and SUPER+SHIFT+Menu defaults).
unbind = SUPER ALT, SPACE
# Waybar is retired (Quickshell bar); Omarchy's toggle would resurrect it.
unbind = SUPER SHIFT, SPACE
# System menu on SUPER+ESC unwanted (ESC is Emacs's back key; menu lives in SUPER+R).
unbind = SUPER, ESCAPE
unbind = SUPER SHIFT, code:201
bindd = SUPER, R, Omarchy menu, exec, omarchy-menu

# Calendar — launches rencal (AUR: rencal-bin). Replaces Omarchy's default
# SUPER+SHIFT+C HEY-webapp launcher and supersedes the earlier Quickshell
# calendar popout (IpcHandler in shell.qml still exists and is reachable
# via clicking the Clock pill, just no longer keybind-driven). SUPER+C
# (Universal copy) and SUPER+CTRL+C (capture menu) are untouched —
# SUPER+C is load-bearing for image paste into the Claude CLI.
unbind = SUPER SHIFT, C
bindd = SUPER SHIFT, C, Calendar, exec, uwsm-app -- rencal

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Logitech MX Keys
# bind = SUPER SHIFT, S, exec, omarchy-capture-screenshot      # Print Screen Button
# bind = SUPER, H, exec, voxtype record toggle                 # Dictation Button
# bind = SUPER, PERIOD, exec, omarchy-launch-walker -m symbols # Emoji Button

# Display scale: cycle through known-good Hyprland scales (1.0 → 2.0 in 0.25
# steps). Bridges the laptop/dock transition — bump up on the high-DPI
# laptop panel, bump down on the dock's external monitor. Applies to every
# enabled monitor at once.
bindd = SUPER ALT, equal, Display scale up,   exec, ~/.config/hypr/scripts/scale.sh up
bindd = SUPER ALT, minus, Display scale down, exec, ~/.config/hypr/scripts/scale.sh down
