# Control your input devices
# See https://wiki.hypr.land/Configuring/Basics/Variables/#input
input {
  # Use multiple keyboard layouts and switch between them with Left Alt + Right Alt
  # kb_layout = us,dk,eu

  # Use a specific keyboard variant if needed (e.g. intl for international keyboards)
  # kb_variant = intl

  kb_layout = us
  # CapsLock is Ctrl (never used as Caps; Compose was the old mapping, also unused).
  # Emacs/nvim/tmux all get a home-row Ctrl out of this.
  kb_options = ctrl:nocaps # ,grp:alts_toggle

  # Change speed of keyboard repeat
  repeat_rate = 40
  repeat_delay = 250

  # Start with numlock on by default
  numlock_by_default = true

  # Increase sensitivity for mouse/trackpad (default: 0)
  # sensitivity = 0.35

  # Turn off mouse acceleration (default: adaptive)
  accel_profile = flat

  touchpad {
    # Use natural (inverse) scrolling
    natural_scroll = true

    # Use two-finger clicks for right-click instead of lower-right corner
    clickfinger_behavior = true

    # Touchpad scroll_factor is set per-machine in ~/.config/hypr/local.conf
    # (touchpad sensitivity varies enough between trackpads to not pin it here).

    # Enable the touchpad while typing
    # disable_while_typing = false

    # Left-click-and-drag with three fingers
    # drag_3fg = 1
  }
}

# Enable touchpad gestures for changing workspaces
# See https://wiki.hypr.land/Configuring/Advanced-and-Cool/Gestures/
# gesture = 3, horizontal, workspace

# Enable touchpad gestures for moving focus (helpful on scrolling layout)
# gesture = 3, left,  dispatcher, movefocus, l
# gesture = 3, right, dispatcher, movefocus, r

# Internal laptop keyboard: swap left Alt and left Super so the bottom row
# reads Ctrl-Fn-Alt-Super-Space instead of Ctrl-Fn-Super-Alt-Space.
# Per-device kb_options replaces the global value, so ctrl:nocaps is repeated.
device {
  name = at-translated-set-2-keyboard
  kb_options = ctrl:nocaps,altwin:swap_lalt_lwin
}
