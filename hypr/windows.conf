# Window rules. Sourced after Omarchy's default windows.conf, so rules here
# override or extend defaults.

# Pin special-workspace inhabitants to their workspaces. The kitty --class
# tags in autostart.conf make these rules target the right windows.
windowrule = workspace special:music silent, match:class ^spotify-player$
windowrule = workspace special:music silent, match:class ^cmus$
windowrule = workspace special:notes, match:class ^notes$

# Quickshell layer surfaces — compositor blur via namespace prefix.
layerrule = blur on, match:namespace ^(quickshell-).*
# Without ignore_alpha, blur applies to every pixel of the (rectangular)
# layer surface — including the fully-transparent pixels in the corners
# of a rounded-rectangle GlassPill. Those corners show blurred wallpaper,
# reading as visible square halos around the pill's rounded edges.
# 0.1 is below the pill's tintAlpha (0.22) but above the transparent
# corners (alpha 0) — so the pill blurs as before and the corners go
# untouched. Note the underscored keyword: the wiki shows "ignorealpha"
# but Hyprland's parser only accepts "ignore_alpha".
layerrule = ignore_alpha 0.1, match:namespace ^(quickshell-).*

# Opacity tiers (last-match-wins). Omarchy tags every window with
# `default-opacity` and strips it for apps that opt out (terminals
# via `terminal` tag, browsers, video, qemu, steam). Active and inactive
# values held equal — Raymond reads focus state from the border color, not
# from a brightness shift, so the bg should stay still as focus moves.
windowrule = opacity 0.90 0.90, match:tag default-opacity
windowrule = opacity 0.85 0.85, match:tag terminal

# Reading surfaces — force opaque. Add other PDF readers/image
# viewers here as they come up.
windowrule = tag -default-opacity, match:class ^([Zz]otero)$
windowrule = opacity 1.0 1.0, match:class ^([Zz]otero)$

# Emacs: fullscreen keeps the WINDOWED look. Omarchy's default gives every
# window opacity 0.97/0.9 but fullscreen snaps to 1.0, so Super+F visibly
# "brightens" the page. `override` = absolute values (plain opacity rules
# MULTIPLY when stacked with the default tag rule — first attempt made
# windowed Emacs visibly different). Active/inactive exactly the default's
# effective values; fullscreen = active.
windowrule = opacity 0.95 override 0.9 override 0.95 override, match:class ^emacs$
