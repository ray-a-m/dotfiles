# Window rules. Sourced after Omarchy's default windows.conf, so rules here
# override or extend defaults.

# Pin special-workspace inhabitants to their workspaces. The kitty --class
# tags in autostart.conf make these rules target the right windows.
windowrule = workspace special:music silent, match:class ^spotify-player$
windowrule = workspace special:notes silent, match:class ^notes$

# Quickshell layer surfaces — apply compositor blur. The QML side tags
# each panel with `WlrLayershell.namespace = "quickshell-<name>"`, this
# rule matches the prefix. Without blur, the glass-pill primitive's
# translucent fill just sits over the raw wallpaper.
layerrule = blur on, match:namespace ^(quickshell-).*
# Waybar blur removed: with `"exclusive": false` the bar window spans the
# full top region but is mostly transparent (only three pills paint). The
# blur pass darkens the *entire* layer surface (including the empty gaps
# between pills) which read as a translucent black strip. Per-pill blur
# needs per-pill layer surfaces — comes with the Quickshell migration.
