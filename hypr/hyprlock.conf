source = ~/.config/omarchy/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
}

# Fixed ThinkPad login screen — deliberately independent of the active
# Omarchy theme. The theme wallpaper is often a video (mornye.mp4), which
# hyprlock cannot render, so it falls back to $color (near-white). Pin a
# static image and a black fallback so the lock screen is never white.
background {
    monitor =
    color = rgba(0,0,0,1.0)
    path = ~/code/dotfiles/hypr/thinkpad-lock.png
    blur_passes = 0
}

animations {
    enabled = false
}

input-field {
    monitor =
    # Match the Plymouth boot splash exactly: 286x48 entry box, centered,
    # sitting 40px below the native-size logo (= 158px below screen center on
    # a 2560x1440 panel). The logo + lock icon are baked into thinkpad-lock.png
    # at the same coordinates Plymouth computes, so boot and lock look identical.
    size = 286, 48
    position = 0, -158
    halign = center
    valign = center

    # Hardcoded ThinkPad palette (white outline / dark field / white text /
    # Lenovo red on check) so the field matches the logo regardless of theme.
    inner_color = rgba(20,20,20,1.0)
    outer_color = rgba(255,255,255,1.0)
    outline_thickness = 2

    font_family = JetBrainsMono Nerd Font
    font_color = rgba(255,255,255,1.0)

    placeholder_text =
    check_color = rgba(197,15,31,1.0)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}
