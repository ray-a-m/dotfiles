# Extra autostart processes
# exec-once = uwsm-app -- my-service

# Anchor each session on the home workspace (middle of the 3×3 grid).
exec-once = hyprctl dispatch workspace 5

# Upstream autostart unconditionally launches swaybg, which silently fails on
# video wallpapers. Re-run the theme-set hook after login so video backgrounds
# get handed off to mpvpaper.
exec-once = sleep 1 && ~/.config/omarchy/hooks/theme-set

# Special-workspace inhabitants. Spawned silently on their target workspace
# at session start; toggled in/out with Super+Shift+M / Super+Shift+N.
# The kitty --class tags pair with windowrules in windows.conf so the
# windows snap back to their special workspaces if ever moved.
exec-once = [workspace special:music silent] uwsm-app -- kitty --class spotify-player -e spotify_player

# Quickshell shell — replaces waybar as the top bar. -d detaches from the
# spawning tty; -n exits if another instance with the same config is
# already running, so re-execing this line during a session-reload no-ops
# instead of stacking duplicate panels. waybar itself is suppressed via
# ~/.local/state/omarchy/toggles/waybar-off (touched by install.sh).
exec-once = uwsm-app -- quickshell -d -n
# Scribbles (special:notes) is NOT pre-populated at session start. The bind
# in bindings.conf calls hypr/scripts/scribbles.sh, which auto-launches yazi
# rooted at ~/Dropbox/scribbles/ when the workspace is empty.
