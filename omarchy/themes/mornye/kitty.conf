# Static kitty theme for mornye. Shipped by the theme (copied into the
# staging dir before templates run, so it wins over the generated one)
# because the Quattro color resolver overrides this theme's explicit
# `cursor` key with a value derived from color15 (#bcc0cc) — a gray
# cursor on the latte palette. Everything below matches what the kitty
# template generates from colors.toml, except the cursor pair.

foreground #4c4f69
background #fafcff
selection_foreground #4c4f69
selection_background #bcc0cc

cursor #4c4f69
cursor_text_color #fafcff

active_border_color #1e66f5
active_tab_background #1e66f5

color0 #fafcff
color1 #d20f39
color2 #40a02b
color3 #df8e1d
color4 #1e66f5
color5 #ea76cb
color6 #179299
color7 #4c4f69
color8 #6c6f85
color9 #d20f39
color10 #40a02b
color11 #df8e1d
color12 #1e66f5
color13 #ea76cb
color14 #179299
color15 #bcc0cc
