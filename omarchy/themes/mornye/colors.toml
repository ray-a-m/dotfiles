# Catppuccin Latte, with `background` brightened from `#eff1f5` to
# `#fafcff` — load-bearing for legibility at ~80% window opacity over
# wallpapers with darker regions.

# The palette is light, but the SYSTEM scheme stays dark: pre-Quattro the
# scheme never derived from the palette (no light.mode marker = dark), so
# the setup was latte terminals + a dark browser/GTK. Quattro's background-
# luminance auto-detect would classify this palette "light" and flip
# LibreWolf/GTK light — pin the mode so it can't.
mode = "dark"

accent = "#1e66f5"
cursor = "#4c4f69"
foreground = "#4c4f69"
background = "#fafcff"
selection_foreground = "#4c4f69"
selection_background = "#bcc0cc"

color0 = "#5c5f77"
color1 = "#d20f39"
color2 = "#40a02b"
color3 = "#df8e1d"
color4 = "#1e66f5"
color5 = "#ea76cb"
color6 = "#179299"
color7 = "#acb0be"
color8 = "#6c6f85"
color9 = "#d20f39"
color10 = "#40a02b"
color11 = "#df8e1d"
color12 = "#1e66f5"
color13 = "#ea76cb"
color14 = "#179299"
color15 = "#bcc0cc"
