# keyd -- laptop-mode modifier remap for the ThinkPad's built-in keyboard.
#
# Device-level (works in Hyprland, TTYs, every app), so it replaces the old
# Hyprland per-device kb_options: keyd grabs the keyboard and re-emits it, so
# Hyprland only sees keyd's virtual device -- a hypr per-device block keyed on
# the physical name would no longer match.  The Corne (external, a different
# USB id) is NOT listed here, so its QMK/Vial layout is untouched.
#
# Deployed to /etc/keyd/default.conf by install.sh (copied, not symlinked, so
# the root daemon never depends on /home).  Edit here, then re-run install.sh
# (or `sudo keyd reload`) to apply.  Panic exit if a remap goes wrong: hold
# Backspace+Escape+Enter together for ~1/2 second.
#
# 0001:0001 = "AT Translated Set 2 keyboard" (the internal keyboard).
# (keyd has no inline comments -- keep notes on their own lines.)
[ids]
0001:0001

[main]
# Progress modifiers onto reachable keys: Right Alt -> Ctrl, Caps Lock -> Alt.
rightalt = leftctrl
capslock = leftalt

# Bottom row: swap left Alt and left Super so it reads Ctrl-Fn-Alt-Super-Space
# (was Hyprland's altwin:swap_lalt_lwin, moved here since keyd now owns this
# keyboard).
leftalt = leftmeta
leftmeta = leftalt
