force_keyboard_focus = true                                                 # forces keyboard forcus to stay in Walker
disable_mouse = true                                                        # prevents the cursor from flashing into walker on h/l
selection_wrap = true                                                       # wrap list if at bottom or top
theme = "omarchy-default"                                                   # theme to use
additional_theme_location = "~/.local/share/omarchy/default/walker/themes/"
hide_action_hints = true                                                    # globally hide the action hints

[placeholders]
"default" = { input = " Search...", list = "No Results" } # placeholders for input and empty list, key is the providers name, so f.e. "desktopapplications" or "menus:other"

[keybinds]
quick_activate = []
# Vim-style global navigation: j/k move down/up. Walker has no per-
# invocation keybind config, so these bind globally — typing 'j' or
# 'k' as the first char in search inputs (apps, emoji, clipboard)
# triggers nav instead of typing. h was previously bound to close so
# it doubled as "back a layer" in nested omarchy-menu, but it was
# removed because typing 'h' as the first search char (e.g. 'wh' for
# WhatsApp) got swallowed.
next = ["ctrl j", "Down", "j"]
previous = ["ctrl k", "Up", "k"]
close = ["Escape"]

[columns]
symbols = 1 # providers to be queried by default

[providers]
max_results = 256 # 256 should be enough for everyone
default = [
  "desktopapplications",
  "websearch",
]

[[providers.prefixes]]
prefix = "/"
provider = "providerlist"

[[providers.prefixes]]
prefix = "."
provider = "files"

[[providers.prefixes]]
prefix = ":"
provider = "symbols"

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = "@"
provider = "websearch"

[[providers.prefixes]]
prefix = "$"
provider = "clipboard"

# Override the dmenu provider's activate key. omarchy-menu invokes
# `walker --dmenu`, so this binds `l` (vim "go right/forward") to
# confirm the highlighted entry. Other providers (apps, emoji, calc)
# keep Return.
[providers.actions]
dmenu = [{ action = "select", default = true, bind = "l" }]

[[emergencies]]
text = "Restart Walker"
command = "omarchy-restart-walker"
