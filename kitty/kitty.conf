# Kitty terminal config — mirrors base Omarchy.

include ~/.config/omarchy/current/theme/kitty.conf
# Omarchy 4 path (missing pre-Quattro = harmless warning; wins post-upgrade).
include ~/.local/state/omarchy/current/theme/kitty.conf

# Font
font_family JetBrainsMono Nerd Font
bold_italic_font auto
font_size        9.0

# Window
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

# Glass: paint the bg semi-transparent so Hyprland blur shows through (it does
# even through translucent windows — looknfeel.conf has `blur.ignore_opacity =
# true`). Only the bg layer is affected; text stays at full alpha, so legibility
# is preserved. ~0.44 lands close to the unfocused-border alpha (0x60 of the
# Hyprland 0.85 window opacity) so the whole window reads as one big "glass"
# of the same character as that border.
background_opacity 0.65
dynamic_background_opacity yes

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard

# Shift+Enter → newline in TUI apps that support it (Claude Code, etc.).
# Kitty sends a distinguishable Shift+Enter natively, but tmux (as of the
# tmux install 2026-07-04) drops the distinction unless we send the CSI-u
# form explicitly. This map forces the CSI-u sequence, which tmux's
# `extended-keys on` passes through unchanged.
map shift+enter send_text all \x1b[13;2u

# Ctrl+Shift+hjkl → directional tmux swap-pane. Same problem as Shift+Enter
# above, worse for h/l: Ctrl+H and Ctrl+L alias the legacy C0 controls
# (Backspace 0x08, Form-Feed 0x0C), so kitty keeps sending them in legacy form
# and tmux never sees a distinct key — the chord leaks into the running app.
# Forcing the CSI-u form (codepoint;modifier — h=104 j=106 k=107 l=108,
# modifier 6 = ctrl+shift) makes tmux's extended-keys match the swap bindings.
map ctrl+shift+h send_text all \x1b[104;6u
map ctrl+shift+j send_text all \x1b[106;6u
map ctrl+shift+k send_text all \x1b[107;6u
map ctrl+shift+l send_text all \x1b[108;6u

# Allow remote access. A listen socket lets `kitty @ --all ...` cross OS
# windows (without it, each kitty instance is isolated to its own panes/tabs).
allow_remote_control yes
listen_on unix:@kitty

# Shell. Pin to zsh explicitly rather than relying on kitty's default `.`,
# which reads $SHELL from the parent process — that breaks immediately after
# `chsh` until a full re-login, since the running Hyprland session keeps the
# old $SHELL cached. Hardcoding the path here makes kitty deterministic.
shell /usr/bin/zsh

# Aesthetics
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
